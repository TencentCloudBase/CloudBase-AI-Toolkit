<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudBase AI Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1F26;--mut:#515863;--accent:#0052D9;--paper:#F6F8FB;--card:#fff;--rule:#E6E9EE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans SC",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
main{max-width:520px}
h1{font-family:"JetBrains Mono",monospace;font-size:28px;letter-spacing:-.03em;margin-bottom:12px}
h1 em{font-style:normal;color:var(--accent)}
p{color:var(--mut);margin-bottom:22px}
ul{list-style:none;display:grid;gap:12px}
a{display:block;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;color:inherit;text-decoration:none}
a strong{display:block;font-family:"JetBrains Mono",monospace}
a span{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>CloudBase <em>AI Toolkit</em></h1>
  <p>Pages on this site.</p>
  <ul>
    <li><a href="evals/"><strong>Evals</strong><span>Public benchmark board</span></a></li>
    <li><a href="2025/"><strong>2025</strong><span>Year-end page</span></a></li>
  </ul>
</main>
</body>
</html>
