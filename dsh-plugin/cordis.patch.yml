# CloudBase DSH plugin bundle patch.
# No env forwarded: login goes through cloudbase-mcp's own device-code flow
# (auth tool, start_auth device). Long-lived cloud credentials are never passed
# here — an invalid key blocks device-code login.

- insert:
    - id: mcp-cloudbase
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cloudbase
        transport: stdio
        command: npx
        args: ['-y', '@cloudbase/cloudbase-mcp@latest']
    - id: cloudbase-dsh-plugin
      name: '@cloudbase/dsh-plugin'
