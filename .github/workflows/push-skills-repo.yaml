name: Push Skills Repository

on:
  push:
    branches:
      - main
    paths:
      - 'config/source/skills/**'
      - 'config/source/guideline/**'
      - 'scripts/build-skills-repo.mjs'
      - 'scripts/skills-repo-template/readme-template.md'
  workflow_dispatch:

jobs:
  push-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Dispatching the downstream pull-back (Sync CloudBase Plugin Skills) below
      # needs actions: write; the default token is read-only for Actions.
      actions: write
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      
      - name: Build skills repository
        run: |
          node scripts/build-skills-repo.mjs
      
      - name: Checkout target repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          repository: TencentCloudBase/skills
          path: skills-repo
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
      
      - name: Copy output to target repository
        run: |
          cd skills-repo
      
          echo "Cleaning auto-generated content, keeping whitelisted local skills..."
      
          # 1. 只删除自动生成的内容，保留白名单目录
          #    - 保留：setup-cloudbase-openclaw
          #    - 保留：所有以 local- 前缀命名的目录（比如 local-*, 方便以后扩展）
          for entry in $(find . -mindepth 1 -maxdepth 1 ! -name '.git'); do
            name="$(basename "$entry")"
      
            case "$name" in
              setup-cloudbase-openclaw|local-*)
                echo "Keep local skill: $name"
                ;;
              *)
                echo "Remove generated entry: $name"
                rm -rf "$entry"
                ;;
            esac
          done
      
          # 2. Copy generated output (rsync includes dotfiles; `cp src/*` drops them)
          # --checksum: version-only bumps often keep identical byte length (e.g. 2.25.5→2.25.6).
          # Default size+mtime quick check can skip those when build output and checkout share a
          # 1s mtime window, yielding porcelain=0 while skills HEAD stays behind.
          rsync -a --checksum ../.skills-repo-output/ .
      
      - name: Commit and push changes
        id: push_skills
        env:
          SKILLS_REPO_TOKEN: ${{ secrets.SKILLS_REPO_TOKEN }}
        run: |
          set -euo pipefail

          cd skills-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Configure git to use token for push
          git remote set-url origin https://x-access-token:${SKILLS_REPO_TOKEN}@github.com/TencentCloudBase/skills.git

          # Stage first: git add hashes content and defeats racy-git false-clean status.
          git add -A

          # Guardrail: compare build output vs committed HEAD (not WT after rsync).
          SOURCE_WEB_VER=$(grep -E '^version:' "${{ github.workspace }}/.skills-repo-output/skills/web-development/SKILL.md" | head -1 | awk '{print $2}')
          HEAD_WEB_VER=$(git show HEAD:skills/web-development/SKILL.md 2>/dev/null | grep -E '^version:' | head -1 | awk '{print $2}' || true)
          STAGED_COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
          echo "web-development version source=${SOURCE_WEB_VER} skills_HEAD=${HEAD_WEB_VER} staged=${STAGED_COUNT}"
          if [ -n "$SOURCE_WEB_VER" ] && [ -n "$HEAD_WEB_VER" ] && [ "$SOURCE_WEB_VER" != "$HEAD_WEB_VER" ] && [ "$STAGED_COUNT" = "0" ]; then
            echo "::error::Skills sync staged no changes but web-development version diverges (skills HEAD ${HEAD_WEB_VER} -> source ${SOURCE_WEB_VER})."
            exit 1
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore: sync skills from CloudBase-AI-ToolKit [skip ci]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # Sync CloudBase Plugin Skills listens on the same config/source/skills/**
      # paths filter, so it starts in the same second as this job and clones
      # TencentCloudBase/skills *before* the push above lands. It then finds no
      # drift against its own .sync-metadata.json, reports success and skips —
      # a green run that did nothing, leaving plugin/cloudbase/skills on the
      # previous version until the 12h cron (observed on v2.34.2: pull-back
      # started 16:23:00Z, upstream push landed 16:23:16Z, so plugin skills
      # stayed on 2.34.1). Dispatch the pull-back explicitly after a real push
      # so it can only ever read content this job has already written.
      - name: Trigger Sync CloudBase Plugin Skills
        if: steps.push_skills.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Sync CloudBase Plugin Skills" --ref main
