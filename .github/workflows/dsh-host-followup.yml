name: Follow DSH host releases

# A new DSH release changes the answer to "is this plugin still supported?".
# Run the real host acceptance against the published version every day so CI
# produces that answer, not whoever happens to remember to check.
#
# The host version is resolved at run time on purpose: noticing a new release is
# the point of this job. It installs into a throwaway directory outside the
# workspace, pinned to the exact version reported by the registry, with install
# scripts disabled. It is never a global install and never a workspace dependency.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "DSH version to verify; defaults to the published latest"
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/dsh-host-followup.yml"
      - "dsh-plugin/scripts/verify-host.mjs"
      - "dsh-plugin/package.json"

permissions:
  contents: read

jobs:
  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Resolve published DSH version
        id: host
        run: |
          VERSION="${{ inputs.dsh_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(npm view @deepseek-ai/dsh dist-tags.latest)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install plugin dependencies and build
        working-directory: ./dsh-plugin
        run: |
          npm install --ignore-scripts
          npm run build

      - name: Install the published host
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-host"
          cd "$RUNNER_TEMP/dsh-host"
          npm init -y >/dev/null
          npm install "@deepseek-ai/dsh@${{ steps.host.outputs.version }}" \
            --ignore-scripts --no-audit --no-fund
          test -x node_modules/.bin/dsh

      - name: Check the declared range covers this host
        env:
          APP_BOOT: ${{ runner.temp }}/dsh-host/node_modules/@deepseek-ai/dsh-app-boot/lib/index.js
          HOST_VERSION: ${{ steps.host.outputs.version }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { pathToFileURL } from "node:url";
            const { evaluatePluginCompatibility } = await import(
              pathToFileURL(process.env.APP_BOOT).href
            );
            const manifest = JSON.parse(readFileSync("dsh-plugin/package.json", "utf8"));
            const issue = evaluatePluginCompatibility(manifest, {}, process.env.HOST_VERSION);
            if (issue) {
              console.error(`engines.dsh ${manifest.engines.dsh} does not cover DSH ${process.env.HOST_VERSION}.`);
              console.error("Run the host acceptance on this version, then decide whether to widen the declared range.");
              process.exit(1);
            }
            console.log(`engines.dsh ${manifest.engines.dsh} covers DSH ${process.env.HOST_VERSION}`);
          '

      - name: Run host acceptance
        id: acceptance
        env:
          DSH_BIN: ${{ runner.temp }}/dsh-host/node_modules/.bin/dsh
        run: node dsh-plugin/scripts/verify-host.mjs

      - name: Report
        if: always()
        env:
          HOST_VERSION: ${{ steps.host.outputs.version }}
          OUTCOME: ${{ steps.acceptance.outcome }}
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const { engines } = JSON.parse(readFileSync("dsh-plugin/package.json", "utf8"));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              "## DSH host follow-up",
              "",
              `- Host: ${process.env.HOST_VERSION}`,
              `- Declared range: ${engines.dsh}`,
              `- Acceptance: ${process.env.OUTCOME}`,
              "- MCP tool list: not checked here; it needs a locally built cloudbase-mcp entrypoint.",
              "",
            ].join("\n"));
          '
