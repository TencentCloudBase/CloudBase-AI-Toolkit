name: Sync Connector Intl Skills

# connectors/cloudbase-intl/skills/ is generated output, aggregated from config/source/**
# by scripts/build-connector-cloudbase-intl.mjs, and it is committed. A corpus change that
# lands on main therefore leaves the committed mirror stale until someone remembers to
# rebuild — which happened twice. This regenerates it on main instead, the same way
# plugin/cloudbase/skills and config/.claude/skills are backfilled.
#
# It doubles as an early warning: the build carries fail-hard guards (China-site host
# residue, region/host contradictions, secrets), so an upstream change that would
# invalidate the connector shows up red here instead of at release time.
on:
  push:
    branches:
      - main
    paths:
      - 'config/source/skills/**'
      - 'config/source/guideline/**'
      - 'scripts/build-allinone-skill.ts'
      - 'scripts/build-connector-cloudbase-intl.mjs'
      - 'connectors/cloudbase-intl/extra/**'
      - 'connectors/cloudbase-intl/connector-meta.json'
      - 'connectors/cloudbase-intl/mcp.json'
      - '.github/workflows/sync-connector-intl-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-connector-intl-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      # The aggregation runs scripts/build-allinone-skill.ts through tsx.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild the connector package
        run: pnpm run build:connector:intl

      # GITHUB_TOKEN pushes do not retrigger workflows, so the [skip ci] marker is
      # documentation rather than a loop guard — kept so the intent is explicit.
      - name: Commit and push if the mirror drifted
        run: |
          if [[ -z "$(git status --porcelain connectors/cloudbase-intl/skills)" ]]; then
            echo "Generated mirror already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add connectors/cloudbase-intl/skills
          git commit -m "chore(connectors): sync generated cloudbase-intl skills from config/source [skip ci]"
          git push
