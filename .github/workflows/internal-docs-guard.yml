name: Internal Docs Guard

# 拦截两个本地内部目录重新入库：specs/ 与 .workbuddy/。
#   - specs/      内部规格 / 设计 / 审视报告，含内部任务 ID
#   - .workbuddy/ IDE 本地状态（AI 记忆、plans、expert 会话历史），
#                 类比 .idea/ / .vscode/，本就不该进版本控制
#
# 本地 lefthook 的 specs-guard 只能保护「包含新版 lefthook.yml 的分支」，
# 挡不住基于旧 main 切出的 worktree —— 那里的 .gitignore 和 lefthook.yml
# 都还是旧版，git add 完全不受限。CI 跑在 GitHub 上，只看 PR diff，
# 跟本地 hook 版本无关，所以这一层是真正的兜底。
#
# 只检查新增/修改（ACMR）：删除这些目录的 PR（历史清理）不受影响。

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  internal-docs-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check for internal dirs entering the repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -uo pipefail

          # 白名单：有真实功能依赖，必须留在仓库
          #   - plugin-marketplace-listing: analyze-plugin-marketplace 脚本与测试的数据文件
          #   - npm-supply-chain-security-hardening: AGENTS.md 强制引用的供应链安全规范
          # 白名单只适用于 specs/；.workbuddy/ 全量禁止。
          WHITELIST=(
            "specs/plugin-marketplace-listing/"
            "specs/npm-supply-chain-security-hardening/"
          )

          CHANGED=""
          for p in specs .workbuddy; do
            if [ -n "${BASE_SHA:-}" ] && git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
              CHANGED+="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- "$p" || true)"$'\n'
            else
              # push 到 main 或拿不到基线时，退回检查当前树里的内容
              CHANGED+="$(git ls-files -- "$p" || true)"$'\n'
            fi
          done

          OFFENDERS=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            keep=0
            for w in "${WHITELIST[@]}"; do
              case "$f" in
                "$w"*) keep=1; break ;;
              esac
            done
            [ "$keep" -eq 0 ] && OFFENDERS+=("$f")
          done <<< "$CHANGED"

          if [ "${#OFFENDERS[@]}" -eq 0 ]; then
            echo "OK: no internal dirs (specs/, .workbuddy/) are entering the repository."
            exit 0
          fi

          echo "::error::specs/ and .workbuddy/ are local-only dirs in this repository and must not be committed."
          echo ""
          echo "The following files were added or modified in this PR:"
          echo ""
          for f in "${OFFENDERS[@]}"; do
            echo "  - $f"
          done
          echo ""
          echo "How to fix:"
          echo ""
          echo "  1. Unstage and untrack them (local files are kept):"
          echo "       git restore --staged specs/ .workbuddy/"
          echo "       git rm -r --cached specs/ .workbuddy/"
          echo "       git add specs/plugin-marketplace-listing specs/npm-supply-chain-security-hardening"
          echo ""
          echo "  2. If you are working in a worktree branched off an older main, merge or"
          echo "     rebase onto current main first so .gitignore and lefthook.yml pick up"
          echo "     these rules."
          echo ""
          echo "  3. The archive location and sync commands for these directories are recorded"
          echo "     in AGENTS.md under the <internal_dirs> section (see origin/main if your"
          echo "     local copy is outdated)."
          echo ""
          exit 1
