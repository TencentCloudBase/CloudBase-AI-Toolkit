name: Promote launcher stable tag

# The launcher's self-update only follows the `stable` dist-tag. A release is
# promoted by hand once it has been out for 72 hours; filling in an older
# version rolls every machine back to it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote, e.g. 1.3.0 (or an older one to roll back)"
        required: true
        type: string
      dry_run:
        description: "Validate only; do not move the tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Validate candidate
        env:
          VERSION: ${{ inputs.version }}
        run: node .github/scripts/promote-launcher-stable.mjs "$VERSION" --dry-run

      - name: Move the stable dist-tag
        if: inputs.dry_run != true
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_LAUNCHER_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_LAUNCHER_TOKEN is required. npm trusted publishing signs npm publish only; moving a dist-tag needs a token."
            exit 1
          fi
          npm dist-tag add "@cloudbase/npm-launcher@$VERSION" stable
          npm dist-tag ls @cloudbase/npm-launcher
