name: Publish to npm

on:
  # Tag push: stable (v1.2.3) and semver prerelease (v1.2.3-beta.1)
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

  workflow_dispatch:


permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg_version.outputs.version }}
      dist_tag: ${{ steps.npm_tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
        
      - name: Cd to mcp
        working-directory: ./mcp
        run: | 
          node -v
          pnpm -v
          node -e 'console.log(require("./package.json").version)'

      - name: Resolve package version
        id: pkg_version
        working-directory: ./mcp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ./mcp
        run: pnpm run build

      - name: Run tests
        working-directory: ./mcp
        run: pnpm exec vitest run

      - name: Smoke CLI cloud-mode
        working-directory: ./mcp
        run: pnpm run test:cli:cloud-mode

      - name: Resolve npm dist-tag
        id: npm_tag
        working-directory: ./mcp
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            SUFFIX="${GITHUB_REF#refs/tags/v}"
            if [[ "$SUFFIX" == *-* ]]; then
              DIST_TAG=beta
            else
              DIST_TAG=latest
            fi
          else
            VERSION=$(node -p "require('./package.json').version")
            if [[ "$VERSION" == *-* ]]; then
              DIST_TAG=beta
            else
              DIST_TAG=latest
            fi
          fi
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Using npm dist-tag: $DIST_TAG"

      - name: Verify npm package signatures
        working-directory: ./mcp
        run: npm audit signatures

      - name: Publish to npm
        working-directory: ./mcp
        run: NODE_AUTH_TOKEN="" npm publish --provenance --access public --tag "${{ steps.npm_tag.outputs.tag }}" --verbose

  # Automates the v2.25.7 production regression checklist against the just-published tarball.
  post-publish-smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Smoke published npm tarball
        working-directory: ./mcp
        env:
          PACKAGE_VERSION: ${{ needs.publish.outputs.version }}
          TENCENTCLOUD_SECRETID: ${{ secrets.TENCENTCLOUD_SECRETID }}
          TENCENTCLOUD_SECRETKEY: ${{ secrets.TENCENTCLOUD_SECRETKEY }}
          CLOUDBASE_ENV_ID: ${{ secrets.CLOUDBASE_ENV_ID }}
          SMOKE_PG_FUNCTION_ID: atoPgPermProbe
        run: node ./scripts/verify-npm-tarball-smoke.mjs

  # Official MCP Registry listing. Requires mcpName on the just-published npm tarball.
  publish-mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Sync server.json version
        env:
          PACKAGE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          test -n "$PACKAGE_VERSION"
          jq --arg v "$PACKAGE_VERSION" \
            '.version = $v | (.packages[]? | select(.registryType == "npm") | .version) = $v' \
            mcp/server.json > mcp/server.json.tmp
          mv mcp/server.json.tmp mcp/server.json

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish mcp/server.json
