# Deploy the public site. /2025/ stays the year-end page from the pages branch.
# /evals/ is the benchmark board. The site root links to both.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "evals/site/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf site-dist
          mkdir -p site-dist/evals
          git fetch --depth=1 origin pages
          git archive origin/pages pages/2025 | tar -x -C site-dist --strip-components=1
          node evals/site/build-index.mjs
          cp evals/site/index.html evals/site/eval-results.json evals/site/tasks.json site-dist/evals/
          cp evals/site/root.html site-dist/index.html
          test -f site-dist/2025/index.html
          test -f site-dist/evals/index.html
          test -f site-dist/index.html
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
