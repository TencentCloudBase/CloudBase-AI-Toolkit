name: Publish @cloudbase/dsh-plugin

on:
  push:
    tags:
      - "dsh-plugin-v[0-9]+.[0-9]+.[0-9]+"
      - "dsh-plugin-v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve package version
        id: pkg_version
        working-directory: ./dsh-plugin
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ./dsh-plugin
        run: npm install --ignore-scripts

      - name: Build
        working-directory: ./dsh-plugin
        run: npm run build

      - name: Test
        working-directory: ./dsh-plugin
        run: npm test

      - name: Verify npm package signatures
        working-directory: ./dsh-plugin
        run: npm audit signatures

      - name: Resolve npm dist-tag
        id: npm_tag
        working-directory: ./dsh-plugin
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        working-directory: ./dsh-plugin
        run: NODE_AUTH_TOKEN="" npm publish --provenance --access public --tag "${{ steps.npm_tag.outputs.tag }}" --verbose
