name: npm-launcher CI

on:
  pull_request:
    paths:
      - "npm-launcher/**"
      - ".github/workflows/npm-launcher-ci.yml"
      - ".github/workflows/npm-launcher-nightly.yml"
      - ".github/workflows/npm-launcher-publish.yml"
  push:
    paths:
      - "npm-launcher/**"
      - ".github/workflows/npm-launcher-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-launcher-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NGE_REGISTRY: https://registry.npmjs.org
      NGE_TELEMETRY: "0" # job-level guard; telemetry.test.mjs turns it on per case with a local sink
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Run launcher tests
        working-directory: ./npm-launcher
        run: npm test
