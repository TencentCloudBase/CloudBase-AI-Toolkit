name: npm-launcher CI

on:
  pull_request:
    paths:
      - "npm-launcher/**"
      - "tests/launcher-direct-install-precondition.test.mjs"
      - "mcp/package.json"
      - "mcp/scripts/prepare-publish.cjs"
      - ".github/workflows/npm-launcher-ci.yml"
      - ".github/workflows/npm-launcher-nightly.yml"
      - ".github/workflows/npm-launcher-publish.yml"
  push:
    paths:
      - "npm-launcher/**"
      - ".github/workflows/npm-launcher-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-launcher-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20"]
        include:
          # Node 22.21+ has built-in http/https proxy support; Node 20 ignores
          # NODE_USE_ENV_PROXY, so the proxy path needs a job of its own.
          - os: ubuntu-latest
            node: "22"
    runs-on: ${{ matrix.os }}
    env:
      NGE_REGISTRY: https://registry.npmjs.org
      NGE_TELEMETRY: "0" # job-level guard; telemetry.test.mjs turns it on per case with a local sink
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run launcher tests
        working-directory: ./npm-launcher
        run: npm test

      # Runs from the repo root: it reads mcp/ as well as npm-launcher/, so it
      # cannot live in the launcher's own suite.
      - name: Check direct-install precondition
        run: node tests/launcher-direct-install-precondition.test.mjs
