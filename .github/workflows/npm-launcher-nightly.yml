name: npm-launcher nightly (real package)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # every Monday 02:00 UTC

permissions:
  contents: read

concurrency:
  group: npm-launcher-nightly
  cancel-in-progress: false

jobs:
  cold-start:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        npm: ["10", "11"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Pin npm ${{ matrix.npm }}
        run: npm i -g npm@${{ matrix.npm }}

      - name: Real-package cold start
        working-directory: ./npm-launcher
        env:
          NGE_REGISTRY: https://registry.npmjs.org
          NGE_SMOKE_MAX_MS: "240000"
          NGE_TELEMETRY: "0" # nightly smoke must not produce telemetry rows
        run: node tests/real-package-smoke.mjs
