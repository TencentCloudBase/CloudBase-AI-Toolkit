name: Sync API Reference Page

on:
  schedule:
    - cron: "30 2 * * *" # 每天 UTC 02:30 (北京时间 10:30)，错开 crawl-docs
  workflow_dispatch: # 手动触发

permissions:
  contents: write # 允许推送 main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # turndown + gfm 不进 package.json，避免污染主依赖树
      - name: Install converter deps
        run: npm install --prefix .api-ref-deps turndown turndown-plugin-gfm

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate API reference page
        run: node scripts/generate-api-reference.mjs
        env:
          API_REF_DEPS_DIR: ${{ github.workspace }}/.api-ref-deps

      - name: Commit and push
        run: |
          git add doc/api-reference.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: 🔄 sync CloudBase open API reference page"
            git push
          fi
