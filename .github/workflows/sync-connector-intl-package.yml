name: Sync Connector Intl Package

# Keeps the committed `cloudbase-intl` connector package coherent with its inputs. Two things
# can drift, and both are fixed here because they have to land in one commit:
#
#  1. `connectors/cloudbase-intl/skills/` is generated output, aggregated from config/source/**
#     by scripts/build-connector-cloudbase-intl.mjs. It is committed, so a corpus change landing
#     on main leaves the mirror stale until someone rebuilds — which happened twice. This
#     regenerates it, the same way plugin/cloudbase/skills and config/.claude/skills are backfilled.
#  2. connector-meta.json's `version` has to advance whenever the package content changes.
#     The content is derived, so it changes for reasons that never touch that file, and a
#     hand-maintained version goes stale silently. scripts/bump-connector-versions.mjs patches it.
#
# Doing both in one job matters: a separate bump job would race the mirror commit, and the loser's
# push would be rejected. Ordering matters too — the bump compares the working tree (not HEAD),
# so it has to run after the rebuild.
#
# This also acts as an early warning: the build carries fail-hard guards (China-site host residue,
# region/host contradictions, secrets), so an upstream change that would invalidate the connector
# shows up red here instead of at release time.
on:
  push:
    branches:
      - main
    paths:
      - 'config/source/skills/**'
      - 'config/source/guideline/**'
      - 'scripts/build-allinone-skill.ts'
      - 'scripts/build-connector-cloudbase-intl.mjs'
      - 'scripts/bump-connector-versions.mjs'
      # Covers the hand-written package inputs (meta/mcp/icon/extra) as well as the generated
      # tree. Self-triggering is not a risk: pushes made with GITHUB_TOKEN do not retrigger
      # workflows, so the commit below cannot start this job again.
      - 'connectors/cloudbase-intl/**'
      - '.github/workflows/sync-connector-intl-package.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-connector-intl-package
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      # The aggregation runs scripts/build-allinone-skill.ts through tsx.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rebuild → bump → commit → push, retried as one unit.
      #
      # These phases are a single step rather than three because a rejected push has to redo all
      # of them. Several bots push main in parallel — this repo has about a dozen such workflows —
      # and a `concurrency:` group only serializes jobs that share its group name, so each
      # workflow naming its own group does not order them. A bare `git push` therefore loses that
      # race eventually: the first real run of this job was rejected with
      # "! [rejected] main -> main (fetch first)". Recovery is a reset onto origin/main plus a
      # clean regeneration, the shape sync-cloudbase-plugin-skills.yml already uses.
      #
      # The bump is inside the loop, not before it: it compares the working tree against the last
      # tag, so a reset that discards the rebuild would discard the bump's input too. The rebuild
      # runs scripts/build-allinone-skill.ts through tsx (hence the install step above), and the
      # zip it produces carries the pre-bump version — harmless, since this job never publishes;
      # release-plugin-zips.yml re-zips from source.
      - name: Rebuild, bump, and push if the package drifted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pushed=false
          for i in 1 2 3; do
            pnpm run build:connector:intl
            node scripts/bump-connector-versions.mjs
            if [[ -z "$(git status --porcelain connectors/cloudbase-intl)" ]]; then
              echo "Generated mirror and version already up to date."
              exit 0
            fi
            git add connectors/cloudbase-intl
            # GITHUB_TOKEN pushes do not retrigger workflows, so this marker is documentation
            # rather than a loop guard — kept so the intent stays explicit.
            git commit -m "chore(connectors): sync generated cloudbase-intl package [skip ci]"
            if git push; then
              pushed=true
              break
            fi
            echo "Push rejected (attempt $i); resetting onto origin/main and regenerating..."
            # Fetch first: the rejection means the remote moved, so the local origin/main ref is
            # stale and resetting onto it would just lose the race again.
            git fetch origin main
            git reset --hard origin/main
            sleep $((i * 2))
          done
          if [ "$pushed" != "true" ]; then
            echo "Failed to push after retries"
            exit 1
          fi
