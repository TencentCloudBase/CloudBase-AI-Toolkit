# Git hooks 配置（lefthook）
# 参考：https://lefthook.dev/configuration/
#
# 规则说明：
# - pre-push git-guard：通用护盾（分支基线 + lockfile 同步检查），
#   见 scripts/git-guard-pre-push.sh（2026-08-24，PR #952/#953 教训沉淀）。
#   任何依赖升级 / 开分支的推送都会被机械校验，失败拒绝 push。

pre-push:
  parallel: false
  jobs:
    - name: git-guard
      run: bash scripts/git-guard-pre-push.sh
